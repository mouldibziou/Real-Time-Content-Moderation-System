# Local demo overlay. Use with compose.yaml and -p toxicity-observability.
services:
  worker:
    environment:
      WORKER_METRICS_PORT: "9101"

  prometheus:
    platform: linux/amd64
    image: ${IMAGE_PREFIX:-toxicity}-prometheus:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.monitoring
      target: prometheus
      platforms: ["linux/amd64"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [svc]

  grafana:
    platform: linux/amd64
    image: ${IMAGE_PREFIX:-toxicity}-grafana:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.monitoring
      target: grafana
      platforms: ["linux/amd64"]
    restart: unless-stopped
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-demo-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    networks: [svc]
    depends_on: [prometheus]

volumes:
  prometheus_data:
  grafana_data:
