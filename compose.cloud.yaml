name: toxicity-cloud

x-application: &application
  platform: linux/amd64
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:rw,nosuid,noexec,size=128m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 75s
  networks: [svc]
  volumes:
    - ${POSTGRES_CA_DIRECTORY:-./certs}:/opt/app/certs:ro

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-environment: &environment
  DATABASE_URL: ${DATABASE_URL:?Set the managed PostgreSQL URL}
  PGSSLROOTCERT: ${POSTGRES_CA_PATH:-}
  REDIS_URL: ${REDIS_URL:?Set the managed Redis URL}
  EXPLAIN_QUEUE_KEY: ${EXPLAIN_QUEUE_KEY:-expl_jobs}
  MODEL_VERSION: v2.0.0
  TOXICITY_DEVICE: cpu
  TOXICITY_INFERENCE_BACKEND: onnx

services:
  migrate:
    platform: linux/amd64
    image: ${IMAGE_PREFIX:-toxicity}-migrations:${IMAGE_TAG:-latest}
    build:
      context: .
      target: migrations
      platforms: ["linux/amd64"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the managed PostgreSQL URL}
      PGSSLROOTCERT: ${POSTGRES_CA_PATH:-}
    volumes:
      - ${POSTGRES_CA_DIRECTORY:-./certs}:/opt/app/certs:ro
    networks: [svc]
    logging: *logging

  api:
    <<: *application
    logging: *logging
    image: ${IMAGE_PREFIX:-toxicity}-api:${IMAGE_TAG:-latest}
    build:
      context: .
      target: runtime
      platforms: ["linux/amd64"]
    expose: ["9100"]
    environment:
      API_METRICS_PORT: "9100"
      TOXICITY_CORS_ORIGINS: ${TOXICITY_CORS_ORIGINS:-}
      UVICORN_LIMIT_CONCURRENCY: ${API_LIMIT_CONCURRENCY:-64}
      <<: *environment
      TOXICITY_CPU_THREADS: ${API_CPU_THREADS:-0}
      TOXICITY_INFERENCE_BATCH_SIZE: ${API_INFERENCE_BATCH_SIZE:-4}
    ports: ["${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-0}"
          memory: ${API_MEMORY:-2G}

  worker:
    <<: *application
    logging: *logging
    image: ${IMAGE_PREFIX:-toxicity}-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      target: worker
      platforms: ["linux/amd64"]
    environment:
      <<: *environment
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
      LOG_LEVEL: INFO
      WORKER_METRICS_PORT: "9101"
      TOXICITY_CPU_THREADS: ${WORKER_CPU_THREADS:-0}
    expose: ["9101"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-0}"
          memory: ${WORKER_MEMORY:-3G}

  prometheus:
    logging: *logging
    platform: linux/amd64
    image: ${IMAGE_PREFIX:-toxicity}-prometheus:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.monitoring
      target: prometheus
      platforms: ["linux/amd64"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-1GB}
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    volumes: ["prometheus_data:/prometheus"]
    networks: [svc]

  grafana:
    logging: *logging
    platform: linux/amd64
    image: ${IMAGE_PREFIX:-toxicity}-grafana:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.monitoring
      target: grafana
      platforms: ["linux/amd64"]
    restart: unless-stopped
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a Grafana admin password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes: ["grafana_data:/var/lib/grafana"]
    networks: [svc]
    depends_on: [prometheus]

networks:
  svc:

volumes:
  prometheus_data:
  grafana_data:
