# Local and staging orchestration. Production replaces db/redis with
# managed addresses and runs migrate as a Job; api/worker stay identical.
name: toxicity

x-application: &application
  platform: linux/amd64
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:rw,nosuid,noexec,size=128m"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  stop_grace_period: 75s
  networks: [svc]

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [svc]
    environment:
      POSTGRES_USER: toxicity
      POSTGRES_PASSWORD: replace-me
      POSTGRES_DB: toxicity
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toxicity -d toxicity"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [svc]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot schema migration; exits 0. API and worker require it done.
  migrate:
    platform: linux/amd64
    restart: "no"
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,noexec,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    build:
      context: .
      target: migrations
      platforms: ["linux/amd64"]
    environment:
      DATABASE_URL: postgresql+psycopg2://toxicity:replace-me@db:5432/toxicity
    depends_on:
      db:
        condition: service_healthy
    networks: [svc]

  api:
    <<: *application
    build:
      context: .
      target: runtime
      platforms: ["linux/amd64"]
    command: ["python", "-m", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--log-config", "/opt/app/docker/logging.json"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://toxicity:replace-me@db:5432/toxicity
      REDIS_URL: redis://redis:6379/0
      EXPLAIN_QUEUE_KEY: expl_jobs
      MODEL_VERSION: v2.0.0
      TOXICITY_DEVICE: cpu
      TOXICITY_INFERENCE_BACKEND: onnx
      TOXICITY_CPU_THREADS: ${API_CPU_THREADS:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [svc]
    deploy:
      resources:
        limits:
          cpus: "${API_CPUS:-2}"
          memory: ${API_MEMORY:-2G}

  worker:
    <<: *application
    build:
      context: .
      target: worker
      platforms: ["linux/amd64"]
    environment:
      DATABASE_URL: postgresql+asyncpg://toxicity:replace-me@db:5432/toxicity
      REDIS_URL: redis://redis:6379/0
      EXPLAIN_QUEUE_KEY: expl_jobs
      MODEL_VERSION: v2.0.0
      TOXICITY_DEVICE: cpu
      TOXICITY_INFERENCE_BACKEND: onnx
      TOXICITY_CPU_THREADS: ${WORKER_CPU_THREADS:-0}
      LOG_LEVEL: INFO
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2}"
          memory: ${WORKER_MEMORY:-3G}
    networks: [svc]

networks:
  svc:

volumes:
  pgdata:
  redisdata:
