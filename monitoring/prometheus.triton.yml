global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: toxicity_api
    metrics_path: /metrics/
    static_configs:
      - targets: [api:9100]
  - job_name: toxicity_worker
    metrics_path: /metrics/
    static_configs:
      - targets: [worker:9101]
  - job_name: toxicity_triton
    metrics_path: /metrics
    static_configs:
      - targets: [triton:8002]
